name: GFPP Supabase ping
on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health check
        run: |
          curl -X GET "https://lbqjawijhzsisymhwpsk.supabase.co/rest/v1/app_settings?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY_PROJECTNAME }}"
